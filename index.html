<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIM-01 · Laboratorio interactivo</title><style>
:root{--ink:#173044;--muted:#647985;--accent:#128596}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 2%,#dff6f8 0,transparent 35%),radial-gradient(circle at 96% 2%,#fff0d8 0,transparent 30%),#f5fafb}.home{min-height:100dvh;max-width:1120px;margin:auto;padding:32px 22px}.eyebrow{font-size:.72rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(2.2rem,6vw,4.3rem);line-height:.95;letter-spacing:-.05em;margin:8px 0 12px}.lead{color:var(--muted);max-width:720px;line-height:1.5;font-size:1.03rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:30px}.card{position:relative;text-align:left;border:1px solid #cddfe2;background:rgba(255,255,255,.72);border-radius:28px;padding:24px;min-height:250px;color:var(--ink);box-shadow:0 16px 45px rgba(23,48,68,.10);cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 20px 55px rgba(23,48,68,.15)}.tag{font-size:.72rem;font-weight:850;color:#52707d}.symbol{font-family:Georgia,serif;font-size:3rem;color:var(--accent);margin:18px 0 8px}.card h2{font-size:1.4rem;margin:0 0 8px}.card p{color:var(--muted);line-height:1.45;margin:0}.go{position:absolute;right:20px;bottom:18px;font-size:1.6rem;color:var(--accent)}.viewer{position:fixed;inset:0;background:#f5fafb;display:none;z-index:10}.viewer.show{display:flex;align-items:center;justify-content:center;padding:0}.viewer-frame-wrap{width:100%;height:100%;position:relative;background:#f5fafb}iframe{border:0;width:100%;height:100%;display:block}.back{position:absolute;z-index:20;top:12px;right:14px;border:1px solid #c8dadd;background:rgba(255,255,255,.78);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border-radius:999px;padding:9px 13px;font-weight:850;color:var(--ink);cursor:pointer;box-shadow:0 8px 24px rgba(23,48,68,.10)}
@media(max-width:700px){.grid{grid-template-columns:1fr}.home{padding:20px 14px}.card{min-height:200px}}
@media(min-width:1000px){.home{display:flex;flex-direction:column;justify-content:center}.grid{gap:24px}.card{min-height:285px}.viewer{background:radial-gradient(circle at 8% 2%,#dff6f8 0,transparent 35%),radial-gradient(circle at 96% 2%,#fff0d8 0,transparent 30%),#f5fafb}.viewer-frame-wrap{width:min(1440px,100vw);height:100vh;box-shadow:0 0 70px rgba(23,48,68,.08)}}
</style></head><body><main id="home" class="home"><div class="eyebrow">Proyecto Cálculo · LIM-01</div><h1>Laboratorio interactivo</h1><p class="lead">Elige una misión. La gráfica será la protagonista: observa, decide y comprueba.</p><section class="grid"><button class="card" data-open="explorador"><span class="tag">Recurso 1 · completo</span><div class="symbol">lim</div><h2>Explorador de límites</h2><p>Límites laterales, bilateral, comportamientos infinitos y asíntotas.</p><span class="go">→</span></button><button class="card" data-open="oscilacion"><span class="tag">Recurso 2 · en revisión</span><div class="symbol">∿</div><h2>Cuando la gráfica oscila</h2><p>Zoom progresivo hacia 0 para comparar dos comportamientos oscilantes.</p><span class="go">→</span></button></section></main><section id="viewer" class="viewer"><div class="viewer-frame-wrap"><button id="back" class="back">← Recursos</button><iframe id="frame" title="Actividad LIM-01"></iframe></div></section><script>
const routes={explorador:'activities/explorador/index.html',oscilacion:'activities/oscilacion/index.html'};const frame=document.querySelector('#frame'),viewer=document.querySelector('#viewer');function openPage(name){if(!routes[name])return;frame.src=routes[name];viewer.classList.add('show');history.replaceState(null,'','#'+name)}function closePage(){viewer.classList.remove('show');frame.src='about:blank';history.replaceState(null,'',location.pathname+location.search)}document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.open)));document.querySelector('#back').addEventListener('click',closePage);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('show'))closePage()});const hash=location.hash.slice(1);if(routes[hash])openPage(hash);
</script></body></html>
